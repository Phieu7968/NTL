<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📗</text></svg>">
<link rel="stylesheet" href="assets/css/style.css">
<title>Giỏ hàng — teamhoc.shop</title>
<script>document.documentElement.classList.add("js");</script>
</head>
<body>
<div id="site-header"></div>

<div class="page-head"><div class="wrap">
  <div class="crumb" style="padding-top:0"><a href="index.html">Trang chủ</a> › <span>Giỏ hàng</span></div>
  <h1>Giỏ hàng của bạn</h1>
  <p>Sản phẩm số — không phí vận chuyển, nhận file qua email sau khi thanh toán được xác nhận.</p>
</div></div>

<section class="sec" style="padding-top:2rem"><div class="wrap">
  <div id="cartWrap"></div>
</div></section>

<div id="site-footer"></div>
<script src="data/products.js"></script>
<script src="assets/js/app.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var T = window.TV;

  function render() {
    var items = T.readCart();
    var wrap = document.getElementById("cartWrap");

    if (!items.length) {
      wrap.innerHTML = '<div class="empty"><div class="ic">🛒</div><h3>Giỏ hàng đang trống</h3>' +
        '<p>Bạn chưa chọn sản phẩm nào. Ghé xem những bộ công cụ được mua nhiều nhất nhé.</p>' +
        '<a class="btn btn-primary" href="shop.html">Xem sản phẩm</a></div>';
      return;
    }

    var sub = T.cartTotal(), rate = T.discountRate(), disc = Math.round(sub * rate), total = sub - disc;

    wrap.innerHTML = '<div class="cart-layout"><div>' +
      items.map(function (i) {
        var p = T.byId(i.id); if (!p) return "";
        return '<div class="cart-item">' +
          '<img src="' + T.cover(p, 240, 180) + '" alt="' + p.name + '" width="240" height="180">' +
          '<div><div class="pc-cat">' + T.catOf(p.cat).name + '</div>' +
            '<h3><a href="product.html?id=' + p.id + '">' + p.name + '</a></h3>' +
            '<div style="font-size:.85rem;color:var(--muted)">' + T.vnd(p.price) + ' / bản quyền</div>' +
            '<button class="rm" data-rm="' + p.id + '" style="margin-top:.4rem">🗑 Xoá</button></div>' +
          '<div style="text-align:right">' +
            '<span class="qty" style="height:38px"><button data-q="-" data-id="' + p.id + '" style="height:38px;width:34px">−</button>' +
            '<input value="' + i.qty + '" data-in="' + p.id + '" style="height:38px;width:40px" inputmode="numeric">' +
            '<button data-q="+" data-id="' + p.id + '" style="height:38px;width:34px">+</button></span>' +
            '<div class="price" style="font-size:1.05rem;margin-top:.5rem">' + T.vnd(p.price * i.qty) + '</div></div>' +
        '</div>';
      }).join("") +
      '<div style="display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1.25rem">' +
        '<a class="btn btn-ghost" href="shop.html">← Tiếp tục mua sắm</a>' +
        '<button class="btn btn-ghost" id="clearBtn">Xoá toàn bộ giỏ</button></div>' +
      '</div>' +

      '<aside class="summary"><h3 style="margin-bottom:1rem">Tóm tắt đơn hàng</h3>' +
        '<div class="sline"><span>Tạm tính (' + T.cartCount() + ' sản phẩm)</span><b>' + T.vnd(sub) + '</b></div>' +
        '<div class="sline"><span>Phí giao hàng</span><b style="color:var(--brand)">Miễn phí</b></div>' +
        (rate ? '<div class="sline"><span>Giảm giá (' + T.getCoupon() + ')</span><b style="color:var(--accent)">−' + T.vnd(disc) + '</b></div>' : "") +
        '<div class="coupon"><input id="cpn" placeholder="Nhập mã giảm giá" value="' + T.getCoupon() + '">' +
          '<button class="btn btn-ghost btn-sm" id="cpnBtn">Áp dụng</button></div>' +
        '<p style="font-size:.78rem;color:var(--muted);margin:0">Mã thử: <b>GIAM10</b>, <b>GIAM20</b>, <b>TEAMHOC</b></p>' +
        '<div class="sline total"><span>Tổng cộng</span><span>' + T.vnd(total) + '</span></div>' +
        '<a class="btn btn-primary btn-block" href="checkout.html" style="margin-top:1rem">Tiến hành thanh toán</a>' +
        '<p style="font-size:.8rem;color:var(--muted);text-align:center;margin:.9rem 0 0">🔒 Thông tin đơn hàng chỉ lưu trên trình duyệt của bạn</p>' +
      '</aside></div>';
  }

  document.addEventListener("click", function (e) {
    var rm = e.target.closest("[data-rm]");
    if (rm) { T.setQty(rm.dataset.rm, 0); T.toast("Đã xoá khỏi giỏ hàng"); render(); return; }

    var qb = e.target.closest("[data-q]");
    if (qb) {
      var cur = T.readCart().find(function (i) { return i.id === qb.dataset.id; });
      if (cur) T.setQty(qb.dataset.id, cur.qty + (qb.dataset.q === "+" ? 1 : -1));
      render(); return;
    }
    if (e.target.id === "clearBtn") { T.clearCart(); T.toast("Đã xoá toàn bộ giỏ hàng"); render(); return; }
    if (e.target.id === "cpnBtn") {
      var v = document.getElementById("cpn").value.trim().toUpperCase();
      if (!v) { T.setCoupon(""); T.toast("Đã bỏ mã giảm giá"); }
      else if (T.COUPONS[v]) { T.setCoupon(v); T.toast("Áp dụng mã " + v + " — giảm " + T.COUPONS[v] * 100 + "% 🎉"); }
      else { T.setCoupon(""); T.toast("Mã “" + v + "” không hợp lệ hoặc đã hết hạn"); }
      render();
    }
  });

  document.addEventListener("change", function (e) {
    var inp = e.target.closest("[data-in]"); if (!inp) return;
    T.setQty(inp.dataset.in, Math.max(0, parseInt(inp.value, 10) || 0));
    render();
  });

  render();
});
</script>
</body>
</html>
