<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📗</text></svg>">
<link rel="stylesheet" href="assets/css/style.css">
<title>Bài viết — TempViet</title>
<script>document.documentElement.classList.add("js");</script>
</head>
<body>
<div id="site-header"></div>
<main id="main"></main>
<div id="site-footer"></div>

<script src="data/products.js"></script>
<script src="assets/js/app.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var T = window.TV, S = T.S;
  var slug = T.qs("slug");
  var post = S.posts.find(function (p) { return p.slug === slug; }) || S.posts[0];
  document.title = post.title + " — TempViet";

  var others = S.posts.filter(function (p) { return p.slug !== post.slug; }).slice(0, 3);
  var picks = S.products.slice().sort(function (a, b) { return b.sold - a.sold; }).slice(0, 3);

  document.getElementById("main").innerHTML =
    '<div class="page-head"><div class="wrap" style="max-width:860px">' +
      '<div class="crumb" style="padding-top:0"><a href="index.html">Trang chủ</a> › <a href="blog.html">Bài viết</a> › <span>' + post.cat + '</span></div>' +
      '<div class="m" style="font-size:.82rem;color:var(--muted);margin-bottom:.5rem">' + post.cat + ' · ' + post.date + ' · khoảng 4 phút đọc</div>' +
      '<h1 style="font-size:clamp(1.7rem,3.4vw,2.6rem)">' + post.emoji + " " + post.title + '</h1>' +
      '<p>' + post.excerpt + '</p>' +
    '</div></div>' +

    '<section class="sec"><div class="wrap"><article class="article">' +
      post.body.map(function (par) { return "<p>" + par + "</p>"; }).join("") +
      '<div style="padding:1.25rem;background:var(--brand-light);border-radius:var(--r);margin:2rem 0">' +
        '<b style="color:var(--ink)">Muốn bỏ qua phần tự dựng file?</b>' +
        '<p style="margin:.4rem 0 .9rem;font-size:.93rem">Chúng tôi đã đóng gói sẵn những gì bài viết này nói tới, kèm hướng dẫn từng bước.</p>' +
        '<a class="btn btn-primary btn-sm" href="shop.html">Xem bộ công cụ →</a></div>' +
    '</article></div></section>' +

    '<section class="sec sec-alt"><div class="wrap"><div class="sec-head"><h2>Sản phẩm liên quan</h2></div>' +
      '<div class="p-grid c3">' + picks.map(T.card).join("") + '</div></div></section>' +

    '<section class="sec"><div class="wrap"><div class="sec-head"><h2>Bài viết khác</h2></div><div class="b-grid">' +
      others.map(function (b) {
        return '<a class="bcard" href="blog-post.html?slug=' + b.slug + '"><div class="top">' + b.emoji + '</div>' +
          '<div class="in"><div class="m"><span>' + b.cat + '</span>·<span>' + b.date + '</span></div>' +
          '<h3>' + b.title + '</h3><p>' + b.excerpt + '</p><div class="r">Đọc tiếp →</div></div></a>';
      }).join("") + '</div></div></section>';
});
</script>
</body>
</html>
